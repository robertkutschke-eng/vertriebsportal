<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vertrieb Pro – stabil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>window.addEventListener("load",function(){if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}});</script>
<style>
:root{--bg:#07111d;--panel:#0d1828;--panel2:#122238;--line:#1f3654;--text:#eef5ff;--muted:#9bb0ce;--blue:#53a5ff;--blue2:#1f6dd6;--green:#19c37d;--orange:#f59e0b;--red:#ef4444;--violet:#8b5cf6;--header-h:58px;--sidebar-w:260px;--bottom-h:74px;--radius:18px;--shadow:0 10px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#07111d,#08131f 40%,#091522);color:var(--text)} body{min-height:100dvh} a{color:#8bc0ff} button,input,select,textarea{font:inherit}
#app{min-height:100dvh;display:grid;grid-template-rows:var(--header-h) 1fr}
header{position:sticky;top:0;z-index:20;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(10,19,32,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.brand-badge{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--blue2),var(--blue));display:grid;place-items:center;font-weight:800}.brand-title{font-weight:800}.brand-sub{font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr;min-height:0} aside{display:none;background:rgba(9,17,29,.85);border-right:1px solid var(--line);padding:18px 14px 18px;overflow:auto} main{min-width:0;min-height:0;overflow:auto;padding:16px;padding-bottom:calc(var(--bottom-h) + 18px)}
.nav{display:grid;gap:8px}.nav button,nav.bottom button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:14px;padding:12px 12px;text-align:left;font-weight:700;cursor:pointer}.nav button.active,nav.bottom button.active{background:linear-gradient(180deg,#12243c,#102034);color:#fff;border-color:#274564}.nav-actions{display:grid;gap:8px;margin-top:16px}.nav-actions button,.bottom-actions button{border:1px solid var(--line);background:#162940;color:#fff;border-radius:14px;padding:12px 12px;text-align:left;font-weight:800;cursor:pointer}.bottom-actions{position:fixed;left:10px;right:10px;bottom:calc(var(--bottom-h) + 10px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;z-index:29}
nav.bottom{position:fixed;left:0;right:0;bottom:0;height:var(--bottom-h);display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(10,19,32,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:30} nav.bottom button{text-align:center;font-size:11px;padding:8px 4px}
.screen{display:none}.screen.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}.section-head h2{margin:0;font-size:26px}.section-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px}.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr}.card,.kpi,.hero{background:linear-gradient(180deg,rgba(16,30,49,.98),rgba(12,24,40,.98));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:16px;margin-bottom:14px}.hero{padding:18px 18px 16px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted)}
.kpi{padding:16px}.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800}.kpi .value{font-size:30px;font-weight:800;margin:8px 0 3px}.kpi .sub{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}.row>*{flex:1 1 190px}.row-tight>*{flex:1 1 140px} label{display:block;margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.45px} input,select,textarea{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text)} textarea{min-height:92px;resize:vertical}
button{border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff}.btn-secondary{background:#162940;color:#fff}.btn-success{background:#0f4b34;color:#fff}.btn-danger{background:#4b1920;color:#fff}.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.item{background:rgba(10,20,34,.92);border:1px solid var(--line);border-radius:16px;padding:14px}.item h4{margin:0 0 6px;font-size:18px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}.b-blue{background:#1e3757;color:#8fc2ff}.b-green{background:#153c28;color:#82f3b6}.b-orange{background:#4d3209;color:#ffd57d}.b-red{background:#4a1820;color:#ff9ba7}.b-violet{background:#352055;color:#c7a8ff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar>*{flex:1 1 220px}.small{font-size:12px;color:var(--muted)} .empty{padding:22px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)} .list{display:grid;gap:12px}.split{display:grid;grid-template-columns:1fr;gap:14px}.quick{display:grid;grid-template-columns:1fr;gap:12px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}
.warn{background:#3c2d0a;border:1px solid #6a4b0f;color:#ffdb90;border-radius:14px;padding:12px 14px;margin-bottom:12px}.ok{background:#103324;border:1px solid #1f6947;color:#9ef1c4;border-radius:14px;padding:12px 14px;margin-bottom:12px}
@media (min-width:780px){.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1.05fr .95fr}}
@media (min-width:1120px){#app{grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--header-h) 1fr}header{grid-column:1 / -1}.layout{grid-column:1 / -1;grid-template-columns:var(--sidebar-w) 1fr}aside{display:block}main{padding:22px 24px 24px}nav.bottom,.bottom-actions{display:none}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><div class="brand-badge">VP</div><div><div class="brand-title">Vertrieb Pro</div><div class="brand-sub">AS Technical Solution GmbH</div></div></div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
    <div class="small" id="backupInfo">Kein Backup erstellt</div>
  </div>
  <input id="restoreFile" type="file" accept="application/json" style="display:none" />
</header>
<div class="layout">
  <aside>
    <div class="nav" id="sideNav"></div><div class="nav-actions" id="sideActions"></div>
    <div class="warn" style="margin-top:16px">Kostenlos und direkt im Browser. Tourensuche läuft über OpenStreetMap-Dienste und kann bei hoher Last gelegentlich langsam sein.</div>
  </aside>
  <main>
    <section id="dashboard" class="screen active"></section>
    <section id="touren" class="screen"></section>
    <section id="tourenplanung" class="screen"></section>
    <section id="leads" class="screen"></section>
    <section id="anfragen" class="screen"></section>
    <section id="maschinen" class="screen"></section>
    <section id="videos" class="screen"></section>
    <section id="spesen" class="screen"></section>
    <section id="kalender" class="screen"></section>
    <section id="wochenbericht" class="screen"></section>
  </main>
</div>
<nav class="bottom" id="bottomNav"></nav><div class="bottom-actions" id="bottomActions"></div>
</div>
<script>
const NAVS=[['dashboard','Start'],['touren','Touren'],['tourenplanung','Tourenübersicht'],['leads','Leads'],['anfragen','Anfragen'],['maschinen','Maschinen'],['videos','Videos'],['spesen','Spesen'],['kalender','Kalender'],['wochenbericht','Bericht']];
const DBKEY='vertrieb_pro_stabil_v1';
const FLYERS=[
  'Woche 1 – Personalmangel entschärfen',
  'Woche 2 – Hygiene und Reinigung',
  'Woche 3 – Ertrag und Ausbeute',
  'Woche 4 – Service und Ausfallsicherheit',
  'Woche 5 – Leasing und Finanzierung',
  'Woche 6 – Nachrüstung statt Neukauf'
];
let state=normalizeState(load());

function normalizeState(s){
  s=s||{};
  return {
    leads:Array.isArray(s.leads)?s.leads:[], anfragen:Array.isArray(s.anfragen)?s.anfragen:[], maschinen:Array.isArray(s.maschinen)?s.maschinen:[],
    videos:Array.isArray(s.videos)?s.videos:[], spesen:Array.isArray(s.spesen)?s.spesen:[], termine:Array.isArray(s.termine)?s.termine:[],
    berichte:Array.isArray(s.berichte)?s.berichte:[], tourPlan:Array.isArray(s.tourPlan)?s.tourPlan:[],
    tourSearch:s.tourSearch||{place:'',radius:15,types:['butcher','hospital','care']}, activeScreen:s.activeScreen||'dashboard',
    lastBackup:s.lastBackup||'', leadEditId:s.leadEditId||null, machineBrands:Array.isArray(s.machineBrands)?s.machineBrands:['GRAEF','Zermat','Bastra'],
    tourBaseMonday:s.tourBaseMonday||'',
    calendarView:s.calendarView||'month', calendarFocusDate:s.calendarFocusDate||new Date().toISOString().slice(0,10), calendarFilter:s.calendarFilter||'alle', reportWeek:s.reportWeek||currentWeekKey()
  };
}
function load(){ try{return JSON.parse(localStorage.getItem(DBKEY)||'null');}catch(e){return null;} }
function save(){ localStorage.setItem(DBKEY, JSON.stringify(state)); updateBackupInfo(false); }
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function val(id){ return document.getElementById(id)?.value?.trim() || ''; }
function euro(v){ return Number(v||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function badge(text,type='blue'){ return `<span class="badge b-${type}">${esc(text)}</span>`; }
function currentWeekKey(){ const d=new Date(); const onejan=new Date(d.getFullYear(),0,1); return `${d.getFullYear()}-KW${String(Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7)).padStart(2,'0')}`; }
function monthKey(dateStr){ const d=new Date(dateStr||new Date()); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function updateBackupInfo(touched=true){ const el=document.getElementById('backupInfo'); if(!el) return; if(touched&&state.lastBackup) el.textContent='Letztes Backup: '+new Date(state.lastBackup).toLocaleString('de-DE'); else el.textContent=state.lastBackup?('Letztes Backup: '+new Date(state.lastBackup).toLocaleString('de-DE')):'Kein Backup erstellt'; }

function showScreen(id){
  state.activeScreen=id; save();
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));
}
function renderNav(){
  const html=NAVS.map(([id,label])=>`<button type="button" data-screen="${id}" class="${state.activeScreen===id?'active':''}">${label}</button>`).join('');
  const actionHtml=`<button type="button" data-action="backup">Backup erstellen</button><button type="button" data-action="restore">Wiederherstellen</button>`;
  document.getElementById('sideNav').innerHTML=html;
  document.getElementById('bottomNav').innerHTML=html;
  document.getElementById('sideActions').innerHTML=actionHtml;
  document.getElementById('bottomActions').innerHTML=actionHtml;
  document.querySelectorAll('[data-screen]').forEach(btn=>btn.addEventListener('click',()=>showScreen(btn.dataset.screen)));
  document.querySelectorAll('[data-action="backup"]').forEach(btn=>btn.addEventListener('click', backupData));
  document.querySelectorAll('[data-action="restore"]').forEach(btn=>btn.addEventListener('click', ()=>document.getElementById('restoreFile').click()));
}

function backupData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='vertrieb-pro-backup-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  state.lastBackup=new Date().toISOString(); save(); updateBackupInfo();
}
function restoreDataFromFile(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const parsed=JSON.parse(fr.result);
      state=normalizeState(parsed);
      save();
      renderAll();
      showScreen(state.activeScreen||'dashboard');
      alert('Backup erfolgreich wiederhergestellt.');
    }catch(e){ alert('Backup-Datei konnte nicht gelesen werden.'); }
  };
  fr.readAsText(file);
}

function renderDashboard(){
  const today=new Date().toISOString().slice(0,10);
  const todayTermine=state.termine.filter(t=>t.date===today).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  document.getElementById('dashboard').innerHTML=`
    <div class="hero"><h1>Vertrieb im Griff</h1><p>Stabile Kernversion mit Tourenplanung, Leads, Kalender, Spesen und Berichten.</p></div>
    <div class="grid grid-4">
      <div class="kpi"><div class="label">Tourenziele</div><div class="value">${state.tourPlan.length}</div><div class="sub">im aktuellen Speicherstand</div></div>
      <div class="kpi"><div class="label">Leads</div><div class="value">${state.leads.length}</div><div class="sub">aktive Einträge</div></div>
      <div class="kpi"><div class="label">Termine heute</div><div class="value">${todayTermine.length}</div><div class="sub">${today}</div></div>
      <div class="kpi"><div class="label">Wochenberichte</div><div class="value">${state.berichte.filter(x=>x.week===currentWeekKey()).length}</div><div class="sub">${currentWeekKey()}</div></div>
    </div>
    <div class="grid quick" style="margin-top:14px">
      <div class="card"><div class="section-head"><div><h2>Touren</h2><p>Neue Ziele im Radius suchen und übernehmen.</p></div></div><div class="row"><button class="btn-primary" id="goTouren">Touren öffnen</button></div></div>
      <div class="card"><div class="section-head"><div><h2>Leads</h2><p>Kontakte sauber nachfassen.</p></div></div><div class="row"><button class="btn-primary" id="goLeads">Leads öffnen</button></div></div>
      <div class="card"><div class="section-head"><div><h2>Kalender</h2><p>Besuche und Follow-ups terminieren.</p></div></div><div class="row"><button class="btn-primary" id="goKalender">Kalender öffnen</button></div></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="section-head"><div><h2>Heute</h2><p>Alle heutigen Termine auf einen Blick.</p></div></div>${todayTermine.length?todayTermine.map(t=>`<div class="item" style="margin-bottom:10px"><h4>${esc(t.title)}</h4><div class="meta"><span>${esc(t.time||'ohne Uhrzeit')}</span><span>${esc(t.place||'')}</span><span>${esc(t.contact||'')}</span></div><div>${esc(t.note||'')}</div></div>`).join(''):'<div class="empty">Heute ist nichts hinterlegt.</div>'}</div>`;
  document.getElementById('goTouren').onclick=()=>showScreen('touren');
  document.getElementById('goLeads').onclick=()=>showScreen('leads');
  document.getElementById('goKalender').onclick=()=>showScreen('kalender');
}


function renderTourenplanung(){
  const el=document.getElementById('tourenplanung');
  const weeks=buildTourWeekPlan();
  if(!el) return;
  if(!weeks.length){
    el.innerHTML=`<div class="section-head"><div><h2>Tourenübersicht</h2><p>Wochenübersicht aus Ihrer Tourenplanung.</p></div></div><div class="card"><div class="empty">Noch keine Tourenziele geladen. Bitte zuerst im Bereich <strong>Touren</strong> Ziele suchen.</div></div>`;
    return;
  }
  const weekTabs=weeks.map((w,i)=>`<button class="${i===0?'btn-primary':'btn-ghost'}" type="button" data-week-tab="${w.week}">Woche ${w.week}</button>`).join('');
  const weekPanels=weeks.map((week,i)=>{
    const dayBlocks=['Montag','Dienstag','Mittwoch','Donnerstag'].map(day=>{
      const rows=week.days[day];
      return `<div class="card" style="margin-bottom:14px">
        <div class="section-head"><div><h2 style="font-size:22px">${day}</h2><p>${rows.length} Kunde(n)</p></div><div>${badge('max. 20','blue')}</div></div>
        ${rows.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Nr.</th><th>Firma</th><th>Kategorie</th><th>Priorität</th><th>Adresse</th><th>km</th><th>Flyer</th></tr></thead><tbody>${rows.map((item,idx)=>`<tr><td>${idx+1}</td><td>${esc(item.name)}</td><td>${esc(item.categoryLabel)}</td><td>${esc(item.priority)}</td><td>${esc(item.address||'')}</td><td>${esc(item.distanceKm)}</td><td>${esc(getCurrentFlyerTitle())}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Keine Kunden eingeplant.</div>'}
      </div>`;
    }).join('');
    return `<div data-week-panel="${week.week}" style="display:${i===0?'block':'none'}">
      <div class="card" style="margin-bottom:14px;background:linear-gradient(180deg,#132842,#102238)">
        <div class="section-head"><div><h2>Woche ${week.week}</h2><p>Montag bis Donnerstag Touren, Freitag Bürotag.</p></div><div>${badge('Freitag Bürotag','violet')}</div></div>
      </div>
      ${dayBlocks}
      <div class="card"><div class="section-head"><div><h2 style="font-size:22px">Freitag</h2><p>Bürotag</p></div><div>${badge('Bürotag','violet')}</div></div><div class="empty">Freitag ist fest als Bürotag reserviert.</div></div>
    </div>`;
  }).join('');
  el.innerHTML=`<div class="section-head"><div><h2>Tourenübersicht</h2><p>Saubere Wochenübersicht wie in Ihrer Excel-Struktur: Woche für Woche mit Montag bis Freitag.</p></div></div>
  <div class="card" style="margin-bottom:14px"><div class="row" id="weekTabBar">${weekTabs}</div></div>
  ${weekPanels}`;
  el.querySelectorAll('[data-week-tab]').forEach(btn=>btn.addEventListener('click',()=>{
    const week=btn.dataset.weekTab;
    el.querySelectorAll('[data-week-tab]').forEach(b=>{b.classList.remove('btn-primary'); b.classList.add('btn-ghost');});
    btn.classList.remove('btn-ghost'); btn.classList.add('btn-primary');
    el.querySelectorAll('[data-week-panel]').forEach(panel=>panel.style.display=panel.dataset.weekPanel===week?'block':'none');
  }));
}
function renderTouren(){
  const currentFlyer=FLYERS[(new Date().getWeekIndex?.()||((Math.floor((Date.now()/604800000))%FLYERS.length)+FLYERS.length))%FLYERS.length];
  document.getElementById('touren').innerHTML=`
    <div class="section-head"><div><h2>Tourenplanung</h2><p>Ort eingeben, Radius suchen, priorisieren und in Leads übernehmen.</p></div></div>
    <div class="split">
      <div>
        <div class="card">
          <div class="row">
            <div><label>Ort</label><input id="tourPlace" placeholder="z. B. Kassel" value="${esc(state.tourSearch.place||'')}" /></div>
            <div><label>Radius km</label><input id="tourRadius" type="number" min="1" max="50" value="${esc(String(state.tourSearch.radius||15))}" /></div>
          </div>
          <div class="row">
            <div><label><input type="checkbox" id="typeButcher" ${state.tourSearch.types.includes('butcher')?'checked':''} style="width:auto;margin-right:8px">Metzger</label></div>
            <div><label><input type="checkbox" id="typeHospital" ${state.tourSearch.types.includes('hospital')?'checked':''} style="width:auto;margin-right:8px">Krankenhäuser</label></div>
            <div><label><input type="checkbox" id="typeCare" ${state.tourSearch.types.includes('care')?'checked':''} style="width:auto;margin-right:8px">Pflegeheime</label></div>
          </div>
          <div class="row"><button class="btn-primary" id="tourSearchBtn">Ziele laden</button><button class="btn-secondary" id="tourExportBtn">CSV exportieren</button><button class="btn-success" id="tourAddALeadsBtn">A-Leads übernehmen</button></div>
          <div class="small" id="tourStatus">Aktueller Flyer: ${esc(getCurrentFlyerTitle())}</div>
        </div>
      </div>
      <div>
        <div class="card"><div class="section-head"><div><h2>Aktive Ziele</h2><p>${state.tourPlan.length} Treffer gespeichert.</p></div></div><div class="ok" style="margin-bottom:12px">Wochenplanung sichtbar direkt darunter. Pro Tag maximal 20 Kunden, Freitag bleibt Bürotag.</div><div id="tourList">${renderTourListHtml()}</div></div>
        <div class="card"><div class="section-head"><div><h2>Wochenplanung</h2><p>Automatisch auf Montag bis Donnerstag verteilt. Freitag bleibt Bürotag.</p></div></div><div id="tourWeekPlan">${renderTourWeekPlanHtml()}</div></div>
        <div class="card" id="tourWeekPlanSummaryCard"><div class="section-head"><div><h2>Aufteilung kompakt</h2><p>Sofort sichtbare Wochen- und Tagesübersicht.</p></div></div><div id="tourWeekPlanSummary">${renderTourWeekPlanSummaryHtml()}</div></div>
      </div>
    </div>`;
  document.getElementById('tourSearchBtn').onclick=runTourSearch;
  document.getElementById('tourExportBtn').onclick=exportTourCsv;
  document.getElementById('tourAddALeadsBtn').onclick=addALeadsFromTour;
}
function getCurrentFlyerTitle(){ const week=Math.floor(Date.now()/604800000); return FLYERS[Math.abs(week)%FLYERS.length]; }
function renderTourListHtml(){
  if(!state.tourPlan.length) return '<div class="empty">Noch keine Ziele geladen.</div>';

function buildTourWeekPlan(){
  const days=['Montag','Dienstag','Mittwoch','Donnerstag'];
  const items=[...state.tourPlan].sort((a,b)=>{
    if(a.visited!==b.visited) return a.visited?1:-1;
    if(a.priority!==b.priority) return ({A:0,B:1,C:2}[a.priority]??9)-({A:0,B:1,C:2}[b.priority]??9);
    return Number(a.distanceKm||0)-Number(b.distanceKm||0);
  });
  const weeks=[];
  items.forEach((item,index)=>{
    const weekIndex=Math.floor(index/80);
    const posInWeek=index%80;
    const dayIndex=Math.floor(posInWeek/20);
    if(!weeks[weekIndex]) weeks[weekIndex]={week:weekIndex+1,days:{Montag:[],Dienstag:[],Mittwoch:[],Donnerstag:[]},office:'Freitag: Bürotag'};
    weeks[weekIndex].days[days[Math.min(dayIndex,3)]].push(item);
  });
  return weeks;
}

function categoryLabelOf(cat){ return cat==='butcher'?'Metzger':cat==='hospital'?'Krankenhaus':'Pflegeheim'; }
function priorityFor(cat,name){ const n=(name||'').toLowerCase(); if(cat==='hospital') return 'A'; if(cat==='care') return n.includes('seniorenzentrum')||n.includes('pflegeheim')?'A':'B'; return n.includes('fleischerei')||n.includes('metzgerei')?'A':'B'; }
async function geocodePlace(place){ const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=de&q='+encodeURIComponent(place); const res=await fetch(url,{headers:{'Accept':'application/json'}}); if(!res.ok) throw new Error('Ort konnte nicht aufgelöst werden'); const data=await res.json(); if(!data.length) throw new Error('Ort nicht gefunden'); return {lat:Number(data[0].lat), lon:Number(data[0].lon), label:data[0].display_name}; }
function overpassQuery(lat,lon,radius,types){ const parts=[]; if(types.includes('butcher')) parts.push(`node[shop=butcher](around:${radius},${lat},${lon});way[shop=butcher](around:${radius},${lat},${lon});relation[shop=butcher](around:${radius},${lat},${lon});`); if(types.includes('hospital')) parts.push(`node[amenity=hospital](around:${radius},${lat},${lon});way[amenity=hospital](around:${radius},${lat},${lon});relation[amenity=hospital](around:${radius},${lat},${lon});`); if(types.includes('care')) parts.push(`node[amenity=nursing_home](around:${radius},${lat},${lon});way[amenity=nursing_home](around:${radius},${lat},${lon});relation[amenity=nursing_home](around:${radius},${lat},${lon});node[social_facility=group_home](around:${radius},${lat},${lon});way[social_facility=group_home](around:${radius},${lat},${lon});node[healthcare=nursing_home](around:${radius},${lat},${lon});way[healthcare=nursing_home](around:${radius},${lat},${lon});`); return `[out:json][timeout:25];(${parts.join('')});out center tags;`; }
function haversine(lat1,lon1,lat2,lon2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
async function runTourSearch(){
  const place=val('tourPlace'); const radius=Math.max(1,Number(val('tourRadius')||15)); const types=['butcher','hospital','care'].filter(t=>document.getElementById('type'+t.charAt(0).toUpperCase()+t.slice(1))?.checked);
  if(!place) return alert('Bitte Ort eingeben.'); if(!types.length) return alert('Bitte mindestens eine Zielgruppe wählen.');
  state.tourSearch={place,radius,types}; save();
  const status=document.getElementById('tourStatus'); status.textContent='Suche läuft ...';
  try{
    const geo=await geocodePlace(place);
    const query=overpassQuery(geo.lat,geo.lon,radius*1000,types);
    let res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});
    if(!res.ok) res=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:query});
    if(!res.ok) throw new Error('Overpass nicht erreichbar');
    const data=await res.json();
    const seen=new Set();
    state.tourBaseMonday = formatDateLocal(startOfWeek(new Date().toISOString().slice(0,10)));
    state.tourPlan=(data.elements||[]).map(el=>{
      const lat=el.lat ?? el.center?.lat; const lon=el.lon ?? el.center?.lon; if(!lat||!lon) return null;
      const tags=el.tags||{}; const name=tags.name || tags.operator || tags.brand || 'Unbenannt';
      const address=[tags['addr:street'], tags['addr:housenumber']].filter(Boolean).join(' ')+(tags['addr:city']?(', '+tags['addr:city']):'');
      const category=tags.shop==='butcher'?'butcher':(tags.amenity==='hospital'?'hospital':'care');
      const key=name+'|'+address+'|'+category; if(seen.has(key)) return null; seen.add(key);
      const dist=haversine(geo.lat,geo.lon,lat,lon);
      return {id:uid(),name,category,categoryLabel:categoryLabelOf(category),address:address||geo.label,distanceKm:dist.toFixed(1),priority:priorityFor(category,name),visited:false,flyer:getCurrentFlyerTitle(),lat,lon};
    }).filter(Boolean).sort((a,b)=>a.distanceKm-b.distanceKm);
    save();
    renderTouren();
    renderTourenplanung();
    const newStatus=document.getElementById('tourStatus'); if(newStatus) newStatus.textContent='Suche abgeschlossen. '+state.tourPlan.length+' Ziel(e) gefunden.';
    const summary=document.getElementById('tourWeekPlanSummaryCard'); if(summary) summary.scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){ const failStatus=document.getElementById('tourStatus'); if(failStatus) failStatus.textContent='Fehler bei der Suche.'; alert(e.message||'Suche fehlgeschlagen'); }
}

function cleanImportedText(text){
  return String(text||'')
    .replace(/\r/g,'')
    .split('\n')
    .map(s=>s.trim())
    .filter(Boolean)
    .filter(line=>!/as\s*technical/i.test(line))
    .filter(line=>!/as-technical\.de/i.test(line))
    .filter(line=>!/industrieweg\s*13[-–]?\s*15/i.test(line))
    .filter(line=>!/sendenhorst/i.test(line))
    .filter(line=>!/robert\s+kutschke/i.test(line))
    .join('\n');
}
function findFirstMatch(text, patterns){
  for(const re of patterns){
    const m = text.match(re);
    if(m && m[1]) return m[1].trim();
  }
  return '';
}
function parseInquiryText(raw){
  const text = cleanImportedText(raw);
  const compact = text.replace(/\n+/g,' \n ');
  const email = findFirstMatch(text, [/([A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})/i]);
  const phone = findFirstMatch(text, [/(?:telefon|tel\.?|mobil|phone)\s*:?\s*([+()\/\d\s-]{6,})/i, /((?:\+49|0)[\d\s\/()-]{7,})/i]).replace(/\s+/g,' ').trim();
  const company = findFirstMatch(text, [/(?:firma|kunde|unternehmen)\s*:?\s*(.+)/i]) || text.split('\n').find(line=>/(gmbh|kg|ag|ug|fleischerei|metzgerei|krankenhaus|pflege|senioren|hotel|restaurant|imbiss)/i.test(line)) || text.split('\n')[0] || '';
  const contact = findFirstMatch(text, [/(?:ansprechpartner|kontakt|name)\s*:?\s*(.+)/i, /(?:herr|frau)\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]+(?:\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöüß\-]+){0,2})/]);
  let address = findFirstMatch(text, [/(?:anschrift|adresse|straße|strasse)\s*:?\s*(.+)/i]);
  let city = '';
  const cityMatch = text.match(/(\d{5}\s+[A-ZÄÖÜa-zäöüß][^\n]+)/);
  if(cityMatch){
    city = cityMatch[1].trim();
    if(address && !address.includes(city)) address = address + ', ' + city;
    if(!address) address = city;
  }
  const product = findFirstMatch(text, [/(?:interesse an|interesse|produkt|bereich|maschine|anfrage)\s*:?\s*(.+)/i]);
  const nextStep = findFirstMatch(text, [/(?:nächster schritt|naechster schritt|weiteres vorgehen)\s*:?\s*(.+)/i]);
  const dateMatch = text.match(/\b(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{2,4})\b/);
  let date = '';
  if(dateMatch){
    let y = dateMatch[3];
    if(y.length===2) y='20'+y;
    date = `${y.padStart(4,'0')}-${String(dateMatch[2]).padStart(2,'0')}-${String(dateMatch[1]).padStart(2,'0')}`;
  }
  const timeMatch = text.match(/\b(\d{1,2})[:.](\d{2})\b/);
  const time = timeMatch ? `${String(timeMatch[1]).padStart(2,'0')}:${timeMatch[2]}` : '';
  return {company, contact, phone, mail:email, city:address || city, product, nextStep, date, time, note:text};
}
async function ensurePdfReader(){
  if(window.pdfjsLib){
    try{ if(!pdfjsLib.GlobalWorkerOptions.workerSrc){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } }catch(e){}
    return true;
  }
  await new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
      resolve();
    };
    s.onerror=()=>reject(new Error('PDF-Leser nicht geladen'));
    document.head.appendChild(s);
  });
  return !!window.pdfjsLib;
}
async function extractPdfText(file){
  if(!file) return '';
  await ensurePdfReader();
  if(!window.pdfjsLib) throw new Error('PDF-Leser nicht geladen');
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let out = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    out.push(content.items.map(it=>it.str).join(' '));
  }
  return out.join('\n');
}

function formatDateDE(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString('de-DE');
}
function isoWeekKeyFromDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return `${date.getUTCFullYear()}-KW${String(weekNo).padStart(2,'0')}`;
}
function spesenEntryBreakdown(entry){
  if(Array.isArray(entry.breakdown) && entry.breakdown.length) return entry.breakdown;
  return [{
    date: entry.date || entry.startDate || '',
    from: entry.from || '',
    to: entry.to || '',
    startTime: entry.startTime || '',
    endTime: entry.endTime || '',
    activity: entry.text || entry.activity || '',
    customers: entry.customers || '',
    amount: Number(entry.amount || 0),
    rateLabel: entry.type || entry.mode || 'Eintrag'
  }];
}
function getSpesenWeekOptions(){
  const weeks = new Map();
  (state.spesen||[]).forEach(entry=>{
    spesenEntryBreakdown(entry).forEach(day=>{
      const key = isoWeekKeyFromDate(day.date);
      if(key && !weeks.has(key)) weeks.set(key, day.date);
    });
  });
  return [...weeks.entries()].sort((a,b)=>b[1].localeCompare(a[1])).map(([key])=>key);
}
function getSpesenEntriesForWeek(weekKey){
  if(!weekKey || weekKey==='ALLE') return state.spesen||[];
  return (state.spesen||[]).filter(entry=>spesenEntryBreakdown(entry).some(day=>isoWeekKeyFromDate(day.date)===weekKey));
}
function timeDiffHours(startTime,endTime){
  if(!startTime || !endTime) return 0;
  const [sh,sm] = startTime.split(':').map(Number);
  const [eh,em] = endTime.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins < 0) mins += 24*60;
  return mins/60;
}
function calcTagestourAmount(startTime,endTime){
  const hours = timeDiffHours(startTime,endTime);
  if(hours >= 12) return 24;
  if(hours >= 8) return 14;
  return 0;
}
function buildSpesenRowsTemplate(mode, startDate, endDate, startLocation, finalDestination, hotelRate=28, dayStartTime, dayEndTime){
  if(!startDate) return [];
  const rows = [];
  if(mode==='tagestour'){
    rows.push({
      date:startDate,
      from:startLocation||'',
      to:finalDestination||'',
      startTime:dayStartTime||'',
      endTime:dayEndTime||'',
      activity:'',
      customers:'',
      amount:calcTagestourAmount(dayStartTime, dayEndTime),
      rateLabel: calcTagestourAmount(dayStartTime, dayEndTime) >= 12 ? 'Tagestour 12h = 24 €' : (calcTagestourAmount(dayStartTime, dayEndTime) >= 8 ? 'Tagestour 8h = 14 €' : 'unter 8h = 0 €')
    });
    return rows;
  }
  const start = new Date(startDate+'T00:00:00');
  const end = new Date((endDate||startDate)+'T00:00:00');
  if(end < start) return [];
  const totalDays = Math.floor((end-start)/86400000)+1;
  for(let i=0;i<totalDays;i++){
    const current = new Date(start);
    current.setDate(start.getDate()+i);
    const date = current.toISOString().slice(0,10);
    let amount = 14;
    let rateLabel = i===0 ? 'Anreisetag = 14 €' : 'Abreisetag = 14 €';
    if(i>0 && i<totalDays-1){
      amount = Number(hotelRate||28);
      rateLabel = `Hoteltag = ${Number(hotelRate||28).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})} €`;
    }
    rows.push({
      date,
      from:i===0 ? (startLocation||'') : '',
      to:i===totalDays-1 ? (finalDestination||'') : '',
      startTime:'',
      endTime:'',
      activity:'',
      customers:'',
      amount,
      rateLabel
    });
  }
  return rows;
}

  if(!host) return;

    host.innerHTML = '<div class="empty">Bitte Reisedaten eingeben.</div>';

function syncSpesenRouteChain(){
  if(val('spMode')!=='mehrtagestour') return;
  const rows = [...document.querySelectorAll('[data-sp-row]')];
  rows.forEach((row, idx)=>{
    if(idx===0) return;
    const prevTo = rows[idx-1].querySelector('[data-field="to"]')?.value || '';
    const fromEl = row.querySelector('[data-field="from"]');
    if(fromEl) fromEl.value = prevTo;
  });
}
function updateSpesenTotals(){
  const rows = [...document.querySelectorAll('[data-sp-row]')];
  let total = 0;
  const summary = [];
  rows.forEach((row)=>{
    const date = row.querySelector('[data-field="date"]').value;
    const from = row.querySelector('[data-field="from"]').value.trim();
    const to = row.querySelector('[data-field="to"]').value.trim();
    const startTime = row.querySelector('[data-field="startTime"]').value;
    const endTime = row.querySelector('[data-field="endTime"]').value;
    let amount = Number(row.querySelector('[data-field="amount"]').value || 0);
    let rateLabel = row.querySelector('[data-field="rateLabel"]').value;
    if(val('spMode')==='tagestour'){
      amount = calcTagestourAmount(startTime, endTime);
      row.querySelector('[data-field="amount"]').value = String(amount);
      row.querySelector('[data-field="amountLabel"]').value = euro(amount);
      rateLabel = amount >= 12 ? 'Tagestour 12h = 24 €' : (amount >= 8 ? 'Tagestour 8h = 14 €' : 'unter 8h = 0 €');
      row.querySelector('[data-field="rateLabel"]').value = rateLabel;
    }
    total += amount;
    const activity = row.querySelector('[data-field="activity"]').value.trim();
    const customers = row.querySelector('[data-field="customers"]').value.trim();
    summary.push(`${formatDateDE(date)} · ${rateLabel} · ${from||'-'} → ${to||'-'}${startTime||endTime ? ` · ${startTime||'--:--'}-${endTime||'--:--'}` : ''}${customers ? ` · Kunden: ${customers}` : ''}${activity ? ` · Tätigkeit: ${activity}` : ''}`);
  });
  const totalEl = document.getElementById('spTotal');
  const summaryEl = document.getElementById('spSummary');
  if(totalEl) totalEl.value = euro(total);
  if(summaryEl) summaryEl.value = summary.join('\n');
}
function bindSpesenRows(){
  document.querySelectorAll('[data-sp-row] [data-field="to"]').forEach(el=>{
    el.oninput = ()=>{ syncSpesenRouteChain(); updateSpesenTotals(); };
  });
  document.querySelectorAll('[data-sp-row] [data-field="startTime"], [data-sp-row] [data-field="endTime"], [data-sp-row] [data-field="activity"], [data-sp-row] [data-field="customers"], [data-sp-row] [data-field="from"]').forEach(el=>{
    el.oninput = ()=>updateSpesenTotals();
  });
}
function collectSpesenRowsFromDom(){

function exportIcsMany(items, filename){
  if(!items || !items.length) return alert('Keine Einträge vorhanden.');
  const body=['BEGIN:VCALENDAR','VERSION:2.0'];
  const pad=s=>String(s).padStart(2,'0');
  const fmt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  items.forEach(item=>{
    const start=new Date((item.date||new Date().toISOString().slice(0,10))+'T'+(item.time||'09:00')+':00');
    const end=new Date((item.date||new Date().toISOString().slice(0,10))+'T'+(item.endTime||item.time||'10:00')+':00');
    if(end<=start) end.setTime(start.getTime()+60*60000);
    body.push('BEGIN:VEVENT');
    body.push(`UID:${item.id||uid()}`);
    body.push(`DTSTAMP:${fmt(new Date())}`);
    body.push(`DTSTART:${fmt(start)}`);
    body.push(`DTEND:${fmt(end)}`);
    body.push(`SUMMARY:${String(item.title||'Termin').replace(/\n/g,' ')}`);
    body.push(`LOCATION:${String(item.place||'').replace(/\n/g,' ')}`);
    body.push(`DESCRIPTION:${String(item.note||'').replace(/\n/g,' ')}`);
    body.push('END:VEVENT');
  });
  body.push('END:VCALENDAR');
  const blob=new Blob([body.join('\n')],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename||'kalender.ics'; a.click();
}

  document.querySelectorAll('[data-contact-calendar]').forEach(b=>b.onclick=()=>{ const [type,id]=b.dataset.contactCalendar.split('|'); const arr=type==='lead'?state.leads:state.anfragen; const x=arr.find(y=>y.id===id); if(!x) return; state.termine.unshift({id:uid(),title:(type==='lead'?'Lead: ':'Anfrage: ')+x.company,date:x.date||new Date().toISOString().slice(0,10),time:x.time||'',endTime:'',place:x.city||'',contact:x.contact||'',phone:x.phone||'',note:x.nextStep||x.note||'',sourceType:type}); state.calendarFocusDate=x.date||new Date().toISOString().slice(0,10); save(); renderAll(); showScreen('kalender'); });
  document.querySelectorAll('[data-lead-edit]').forEach(b=>b.onclick=()=>{ state.leadEditId=b.dataset.leadEdit; save(); showScreen('leads'); renderAll(); });
  document.querySelectorAll('[data-anfrage-to-lead]').forEach(b=>b.onclick=()=>{ const id=b.dataset.anfrageToLead; const i=state.anfragen.findIndex(x=>x.id===id); if(i<0) return; const anfrage=state.anfragen[i]; state.leads.unshift({...anfrage,id:uid(),status:['Neu','Kontaktiert','Angebot','Nachfassen'].includes(anfrage.status)?anfrage.status:'Neu'}); state.anfragen.splice(i,1); save(); renderAll(); showScreen('leads'); });
  document.querySelectorAll('[data-machine-delete]').forEach(b=>b.onclick=()=>{ state.maschinen=state.maschinen.filter(x=>x.id!==b.dataset.machineDelete); save(); renderAll(); });
  document.querySelectorAll('[data-brand-delete]').forEach(b=>b.onclick=()=>{ const brand=b.dataset.brandDelete; if(!confirm('Marke löschen? Zugeordnete Maschinen bleiben erhalten.')) return; state.machineBrands=(state.machineBrands||[]).filter(x=>x!==brand); save(); renderAll(); showScreen('maschinen'); });
  document.querySelectorAll('[data-video-delete]').forEach(b=>b.onclick=()=>{ state.videos=state.videos.filter(x=>x.id!==b.dataset.videoDelete); save(); renderAll(); });
  document.querySelectorAll('[data-spesen-delete]').forEach(b=>b.onclick=()=>{ state.spesen=state.spesen.filter(x=>x.id!==b.dataset.spesenDelete); save(); renderAll(); });
  document.querySelectorAll('[data-cal-delete]').forEach(b=>b.onclick=()=>{ state.termine=state.termine.filter(x=>x.id!==b.dataset.calDelete); save(); renderAll(); });
  document.querySelectorAll('[data-cal-export]').forEach(b=>b.onclick=()=>{ const x=filteredCalendarItems().find(t=>t.id===b.dataset.calExport) || state.termine.find(t=>t.id===b.dataset.calExport); if(x) exportIcs(x); });
  document.querySelectorAll('[data-cal-focus]').forEach(b=>b.onclick=()=>{ state.calendarFocusDate=b.dataset.calFocus; save(); renderKalender(); attachDelegatedHandlers(); });
  document.querySelectorAll('[data-report-delete]').forEach(b=>b.onclick=()=>{ state.berichte=state.berichte.filter(x=>x.id!==b.dataset.reportDelete); save(); renderAll(); });
  document.querySelectorAll('[data-report-print]').forEach(b=>b.onclick=()=>printReport(b.dataset.reportPrint));
}

Date.prototype.getWeekIndex=function(){ return Math.floor((((this - new Date(this.getFullYear(),0,1))/86400000)+new Date(this.getFullYear(),0,1).getDay())/7); };

document.getElementById('restoreFile').addEventListener('change', e=>restoreDataFromFile(e.target.files[0]));

window.addEventListener('error', (e)=>{ console.error(e.error||e.message); });
renderAll();
</script>
</body>
</html>
